<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d9dfd1" />
    <meta
      name="description"
      content="Explore a tiny 3D office, work a 9-to-5, and get away with harmless office mischief."
    />
    <title>Office Hours — The whole office is a game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game" aria-label="Office Hours 3D office game">
      <canvas
        id="office-canvas"
        tabindex="0"
        aria-label="Interactive 3D office. Walk using WASD or arrow keys, drag to look around, and click an office station to take an action."
      ></canvas>
      <div id="accessible-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <noscript>This game needs JavaScript. Please enable it and reload.</noscript>
    </main>
  </body>
</html>
